[project]
name = "fincopilot"
version = "0.2.0"
description = "Local-first, provenance-preserving annual report analysis"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "pdfplumber>=0.11.4",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "reportlab>=4.2",
]
# Eval-only: renders EDGAR HTML filings to PDF for the XBRL eval harness (T1.1).
eval = [
    "playwright>=1.45",
]

[tool.uv]
# A deploy host that runs `uv sync` against uv.lock would otherwise install the
# dev group too, putting pytest, ruff and reportlab in a 1 GB container that
# only needs to serve the app. Local work uses `uv sync --dev`, CI likewise.
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fincopilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ollama and not gemini and not network'"
markers = [
    "ollama: requires a live Ollama server; deselected by default and in CI",
    "gemini: requires a live Gemini API key; deselected by default and in CI",
    "network: requires network access (e.g. SEC EDGAR); deselected by default and in CI",
]
